<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign up for AI-Learning System - Start your personalized learning journey.">
  <title>Sign Up - AI-Learning System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css?v=3">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css?v=3">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card animate-scale-in">
      <!-- Logo -->
      <div class="auth-header">
        <a href="../index.html" class="auth-logo">
          <img src="../assets/images/logo.png" alt="AI-Learning System logo" class="brand-logo">
          <span>AI-<span style="color:var(--primary);">Learning</span> System</span>
        </a>
        <h1>Create Your Account</h1>
        <p>Start your personalized learning journey today</p>
      </div>

      <!-- Alert Messages -->
      <div class="alert alert-error" id="signupError"></div>
      <div class="alert alert-success" id="signupSuccess"></div>

      <!-- Signup Form -->
      <form id="signupForm" novalidate>
        <div class="signup-scroll">
          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="signupName">Full Name</label>
            <input
              type="text"
              id="signupName"
              class="form-input"
              placeholder="Enter your full name"
              required
              autocomplete="name"
            >
            <div class="form-error" id="nameError"></div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="signupEmail">Email Address</label>
            <input
              type="email"
              id="signupEmail"
              class="form-input"
              placeholder="you@example.com"
              required
              autocomplete="email"
            >
            <div class="form-error" id="suEmailError"></div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="signupPassword">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="signupPassword"
                class="form-input"
                placeholder="Min. 6 characters"
                required
                autocomplete="new-password"
              >
              <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">&#128065;</button>
            </div>
            <div class="form-error" id="suPasswordError"></div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="signupConfirmPassword">Confirm Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="signupConfirmPassword"
                class="form-input"
                placeholder="Re-enter your password"
                required
                autocomplete="new-password"
              >
              <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Show password">&#128065;</button>
            </div>
            <div class="form-error" id="confirmError"></div>
          </div>

          <!-- Education Level -->
          <div class="form-group">
            <label class="form-label" for="educationLevel">Education Level</label>
            <select id="educationLevel" class="form-select" required>
              <option value="">Select your education level</option>
              <option value="School">School</option>
              <option value="Undergraduate">Undergraduate</option>
              <option value="Postgraduate">Postgraduate</option>
              <option value="Professional">Professional</option>
            </select>
            <div class="form-error" id="eduError"></div>
          </div>

          <!-- Learning Goal -->
          <div class="form-group">
            <label class="form-label" for="learningGoal">Learning Goal</label>
            <select id="learningGoal" class="form-select" required>
              <option value="">Select your learning goal</option>
              <option value="Exam Preparation">Exam Preparation</option>
              <option value="Skill Development">Skill Development</option>
              <option value="Career Preparation">Career Preparation</option>
              <option value="Competitive Exams">Competitive Exams</option>
              <option value="Personal Learning">Personal Learning</option>
            </select>
            <div class="form-error" id="goalError"></div>
          </div>

          <!-- Row: Format + Daily Goal -->
          <div class="auth-row">
            <!-- Preferred Learning Format -->
            <div class="form-group">
              <label class="form-label" for="preferredFormat">Preferred Format</label>
              <select id="preferredFormat" class="form-select" required>
                <option value="">Select format</option>
                <option value="Video">Video</option>
                <option value="Reading">Reading</option>
                <option value="Practice">Practice</option>
                <option value="Flashcards">Flashcards</option>
                <option value="Mixed">Mixed</option>
              </select>
              <div class="form-error" id="formatError"></div>
            </div>

            <!-- Daily Learning Goal -->
            <div class="form-group">
              <label class="form-label" for="dailyGoal">Daily Goal</label>
              <select id="dailyGoal" class="form-select" required>
                <option value="">Select goal</option>
                <option value="15 minutes">15 min</option>
                <option value="30 minutes">30 min</option>
                <option value="45 minutes">45 min</option>
                <option value="60 minutes">60 min</option>
              </select>
              <div class="form-error" id="dailyError"></div>
            </div>
          </div>

          <!-- Terms -->
          <div class="form-group terms-group">
            <label class="form-checkbox">
              <input type="checkbox" id="agreeTerms" required>
              I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>
            </label>
            <div class="form-error" id="termsError"></div>
          </div>
        </div>

        <!-- Sign Up Button -->
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="signupBtn" style="margin-top:var(--space-lg);">
          <span id="signupBtnText">Create Account</span>
          <span class="spinner" id="signupSpinner" style="display:none;"></span>
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">
        <span>or sign up with</span>
      </div>

      <!-- Google Signup -->
      <button class="btn btn-google btn-block" id="googleSignupBtn" type="button">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign up with Google
      </button>

      <!-- Footer -->
      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </main>

  <!-- Theme Toggle (floating) -->
  <button class="navbar-icon-btn theme-toggle" id="themeToggle"
    style="position:fixed;top:1rem;right:1rem;z-index:1001;width:44px;height:44px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);box-shadow:var(--shadow-md);"
    aria-label="Toggle theme">&#9790;</button>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js?v=3"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/google-auth.js?v=1"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/navigation.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var auth = LearnSphereAuth;
      var form = document.getElementById('signupForm');
      var errorAlert = document.getElementById('signupError');
      var successAlert = document.getElementById('signupSuccess');
      var signupBtn = document.getElementById('signupBtn');
      var signupBtnText = document.getElementById('signupBtnText');
      var signupSpinner = document.getElementById('signupSpinner');

      // If already logged in, redirect
      if (auth.isLoggedIn()) {
        window.location.href = '../index.html';
        return;
      }

      // Initialize theme
      LearnSphereTheme.init();

      // Password toggles
      function setupPasswordToggle(toggleId, inputId) {
        var btn = document.getElementById(toggleId);
        var input = document.getElementById(inputId);
        if (btn && input) {
          btn.addEventListener('click', function () {
            var type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
            btn.innerHTML = type === 'password' ? '&#128065;' : '&#128064;';
          });
        }
      }
      setupPasswordToggle('togglePassword', 'signupPassword');
      setupPasswordToggle('toggleConfirmPassword', 'signupConfirmPassword');

      // Clear errors on input
      var allInputs = form.querySelectorAll('.form-input, .form-select');
      allInputs.forEach(function (input) {
        input.addEventListener('input', function () {
          var errorEl = input.parentElement.querySelector('.form-error') ||
                        input.closest('.form-group').querySelector('.form-error');
          if (errorEl) errorEl.classList.remove('show');
          input.classList.remove('error');
          errorAlert.classList.remove('show');
        });
      });

      // Helper to show field error
      function showFieldError(inputId, errorId, message) {
        var input = document.getElementById(inputId);
        var error = document.getElementById(errorId);
        if (input) input.classList.add('error');
        if (error) {
          error.textContent = message;
          error.classList.add('show');
        }
      }

      // Form submission
      form.addEventListener('submit', function (e) {
        e.preventDefault();

        // Clear all errors
        var allErrors = form.querySelectorAll('.form-error');
        allErrors.forEach(function (el) { el.classList.remove('show'); });
        allInputs.forEach(function (el) { el.classList.remove('error'); });
        errorAlert.classList.remove('show');

        var valid = true;

        // Name
        var name = document.getElementById('signupName').value.trim();
        if (!name) {
          showFieldError('signupName', 'nameError', 'Full name is required.');
          valid = false;
        } else if (name.length < 2) {
          showFieldError('signupName', 'nameError', 'Name must be at least 2 characters.');
          valid = false;
        }

        // Email
        var email = document.getElementById('signupEmail').value.trim();
        if (!email) {
          showFieldError('signupEmail', 'suEmailError', 'Email is required.');
          valid = false;
        } else if (!auth.isValidEmail(email)) {
          showFieldError('signupEmail', 'suEmailError', 'Please enter a valid email address.');
          valid = false;
        }

        // Password
        var password = document.getElementById('signupPassword').value;
        if (!password) {
          showFieldError('signupPassword', 'suPasswordError', 'Password is required.');
          valid = false;
        } else if (password.length < 6) {
          showFieldError('signupPassword', 'suPasswordError', 'Password must be at least 6 characters.');
          valid = false;
        }

        // Confirm Password
        var confirmPassword = document.getElementById('signupConfirmPassword').value;
        if (!confirmPassword) {
          showFieldError('signupConfirmPassword', 'confirmError', 'Please confirm your password.');
          valid = false;
        } else if (password !== confirmPassword) {
          showFieldError('signupConfirmPassword', 'confirmError', 'Passwords do not match.');
          valid = false;
        }

        // Education Level
        var educationLevel = document.getElementById('educationLevel').value;
        if (!educationLevel) {
          showFieldError('educationLevel', 'eduError', 'Please select your education level.');
          valid = false;
        }

        // Learning Goal
        var learningGoal = document.getElementById('learningGoal').value;
        if (!learningGoal) {
          showFieldError('learningGoal', 'goalError', 'Please select a learning goal.');
          valid = false;
        }

        // Preferred Format
        var preferredFormat = document.getElementById('preferredFormat').value;
        if (!preferredFormat) {
          showFieldError('preferredFormat', 'formatError', 'Please select a preferred format.');
          valid = false;
        }

        // Daily Goal
        var dailyGoal = document.getElementById('dailyGoal').value;
        if (!dailyGoal) {
          showFieldError('dailyGoal', 'dailyError', 'Please set a daily learning goal.');
          valid = false;
        }

        // Terms
        var agreeTerms = document.getElementById('agreeTerms').checked;
        if (!agreeTerms) {
          var termsError = document.getElementById('termsError');
          termsError.textContent = 'You must agree to the terms.';
          termsError.classList.add('show');
          valid = false;
        }

        if (!valid) return;

        // Show loading
        signupBtn.disabled = true;
        signupBtnText.textContent = 'Creating Account...';
        signupSpinner.style.display = 'inline-block';

        // Simulate network delay
        setTimeout(function () {
          function finish(result) {
            signupBtn.disabled = false;
            signupBtnText.textContent = 'Create Account';
            signupSpinner.style.display = 'none';

            if (result && result.success) {
              successAlert.textContent = result.message + ' Redirecting to login...';
              successAlert.classList.add('show');
              errorAlert.classList.remove('show');

              setTimeout(function () {
                window.location.href = 'login.html';
              }, 1500);
            } else {
              errorAlert.textContent = (result && result.message) || 'Registration failed. Please try again.';
              errorAlert.classList.add('show');
              successAlert.classList.remove('show');
            }
          }

          try {
            Promise.resolve(auth.registerUser({
              name: name,
              email: email,
              password: password,
              confirmPassword: confirmPassword,
              educationLevel: educationLevel,
              learningGoal: learningGoal,
              preferredFormat: preferredFormat,
              dailyGoal: dailyGoal
            })).then(finish).catch(function (err) {
              console.error('Signup error:', err);
              finish({ success: false, message: 'Registration failed. Please try again.' });
            });
          } catch (err) {
            console.error('Signup error:', err);
            finish({ success: false, message: 'Registration failed. Please try again.' });
          }
        }, 1000);
      });
    });
  </script>

</body>
</html>
