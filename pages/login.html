<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to AI-Learning System - Your personalized learning platform.">
  <title>Login - AI-Learning System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=3">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css?v=3">
</head>
<body>
  <nav class="navbar" id="navbar" aria-label="Primary">
    <div class="navbar-inner">
      <a href="../index.html" class="navbar-brand">
        <img src="../assets/images/logo.png" alt="AI-Learning System logo" class="brand-logo">
        <span>AI-<span class="brand-text-accent">Learning</span> System</span>
      </a>
      <div class="navbar-actions">
        <button type="button" class="navbar-icon-btn theme-toggle" aria-label="Toggle theme">&#9790;</button>
        <div class="navbar-auth" id="authGuest">
          <a href="login.html" class="btn btn-ghost btn-sm">Login</a>
          <a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a>
        </div>
      </div>
    </div>
  </nav>
  <main class="auth-main">
    <div class="auth-container animate-fade-in-up">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Sign in to continue your learning journey</p>
        </div>
        <div id="loginError" class="alert alert-error" style="display:none;"></div>
        <div id="loginSuccess" class="alert alert-success" style="display:none;"></div>
        <form id="loginForm" class="auth-form" novalidate>
          <div class="form-group">
            <label for="loginEmail" class="form-label">Email Address</label>
            <input type="email" id="loginEmail" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
            <span id="emailError" class="form-error"></span>
          </div>
          <div class="form-group">
            <label for="loginPassword" class="form-label">Password</label>
            <div class="input-with-icon">
              <input type="password" id="loginPassword" name="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" class="input-icon-btn" id="togglePassword" aria-label="Toggle password visibility">
                <span class="password-icon-show">&#128065;</span>
              </button>
            </div>
            <span id="passwordError" class="form-error"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
            <span id="loginBtnText">Login</span>
          </button>
          <div class="auth-divider">
            <span>or</span>
          </div>
          <button type="button" class="btn btn-secondary btn-block btn-lg btn-google" id="googleLoginBtn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </button>
        </form>
        <div class="auth-footer">
          <p>Don't have an account? <a href="signup.html" class="auth-link">Sign Up</a></p>
          <p><a href="forgot-password.html" class="auth-link">Forgot Password?</a></p>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer footer-compact">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 AI Learning System. All rights reserved.</p>
      </div>
    </div>
  </footer>
  <script src="../js/config.js"></script>
  <script src="../js/api.js?v=3"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/google-auth.js?v=1"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/navigation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      LearnSphereTheme.init();
      LearnSphereNav.init();
      var auth = LearnSphereAuth;
      var form = document.getElementById('loginForm');
      var emailInput = document.getElementById('loginEmail');
      var passwordInput = document.getElementById('loginPassword');
      var emailError = document.getElementById('emailError');
      var passwordError = document.getElementById('passwordError');
      var errorAlert = document.getElementById('loginError');
      var successAlert = document.getElementById('loginSuccess');
      var loginBtn = document.getElementById('loginBtn');
      var loginBtnText = document.getElementById('loginBtnText');
      var togglePassword = document.getElementById('togglePassword');
      function getRedirectUrl() {
        try {
          var params = new URLSearchParams(window.location.search);
          var redirect = params.get('redirect');
          if (redirect && redirect.indexOf('..') === -1 && redirect.startsWith('../')) return redirect;
        } catch (e) {}
        return '../pages/dashboard.html';
      }
      function clearErrors() {
        emailError.textContent = ''; passwordError.textContent = '';
        emailError.classList.remove('show'); passwordError.classList.remove('show');
        emailInput.classList.remove('error'); passwordInput.classList.remove('error');
        errorAlert.style.display = 'none'; successAlert.style.display = 'none';
      }
      togglePassword && togglePassword.addEventListener('click', function () {
        var type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
      });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        clearErrors();
        var email = emailInput.value.trim();
        var password = passwordInput.value;
        var valid = true;
        if (!email) { emailError.textContent = 'Email is required.'; emailError.classList.add('show'); emailInput.classList.add('error'); valid=false; }
        else if (!auth.isValidEmail(email)) { emailError.textContent = 'Please enter a valid email.'; emailError.classList.add('show'); emailInput.classList.add('error'); valid=false; }
        if (!password) { passwordError.textContent = 'Password is required.'; passwordError.classList.add('show'); passwordInput.classList.add('error'); valid=false; }
        if (!valid) return;
        loginBtn.disabled = true; loginBtnText.textContent = 'Logging in...';
        Promise.resolve(auth.loginUser(email, password)).then(function (result) {
          loginBtn.disabled = false; loginBtnText.textContent = 'Login';
          if (result && result.success) {
            successAlert.textContent = result.message; successAlert.style.display='block';
            setTimeout(function(){ window.location.href = getRedirectUrl(); }, 800);
          } else {
            errorAlert.textContent = (result && result.message) || 'Login failed. Please try again.'; errorAlert.style.display='block';
          }
        }).catch(function (err) {
          console.error('Login error:', err);
          loginBtn.disabled = false; loginBtnText.textContent = 'Login';
          errorAlert.textContent = 'Network error. Please try again.'; errorAlert.style.display='block';
        });
      });
    });
  </script>
</body>
</html>
