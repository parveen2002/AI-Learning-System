<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your AI-Learning System password.">
  <title>Forgot Password - AI-Learning System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card animate-scale-in">
      <!-- Logo -->
      <div class="auth-header">
        <a href="../index.html" class="auth-logo">
          <img src="../assets/images/logo.png" alt="AI-Learning System logo" class="brand-logo">
          <span>AI-<span style="color:var(--primary);">Learning</span> System</span>
        </a>
        <h1>Forgot Password?</h1>
        <p>Enter your email and we'll send you reset instructions.</p>
      </div>

      <!-- Alert Messages -->
      <div class="alert alert-error" id="resetError"></div>
      <div class="alert alert-success" id="resetSuccess"></div>

      <!-- Reset Form -->
      <form id="resetForm" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="resetEmail">Email Address</label>
          <input
            type="email"
            id="resetEmail"
            class="form-input"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
          <div class="form-error" id="resetEmailError"></div>
        </div>

        <!-- Send Button -->
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetBtn">
          <span id="resetBtnText">Send Reset Link</span>
          <span class="spinner" id="resetSpinner" style="display:none;"></span>
        </button>
      </form>

      <!-- Back to Login -->
      <div class="auth-footer" style="margin-top:var(--space-xl);">
        <a href="login.html" style="display:inline-flex;align-items:center;gap:6px;">
          &#8592; Back to Login
        </a>
      </div>
    </div>
  </main>

  <!-- Theme Toggle (floating) -->
  <button class="navbar-icon-btn theme-toggle" id="themeToggle"
    style="position:fixed;top:1rem;right:1rem;z-index:1001;width:44px;height:44px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-md);box-shadow:var(--shadow-md);"
    aria-label="Toggle theme">&#9790;</button>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/navigation.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var auth = LearnSphereAuth;
      var form = document.getElementById('resetForm');
      var emailInput = document.getElementById('resetEmail');
      var emailError = document.getElementById('resetEmailError');
      var errorAlert = document.getElementById('resetError');
      var successAlert = document.getElementById('resetSuccess');
      var resetBtn = document.getElementById('resetBtn');
      var resetBtnText = document.getElementById('resetBtnText');
      var resetSpinner = document.getElementById('resetSpinner');

      // Initialize theme
      LearnSphereTheme.init();

      // Clear error on input
      emailInput.addEventListener('input', function () {
        emailError.classList.remove('show');
        emailInput.classList.remove('error');
        errorAlert.classList.remove('show');
      });

      // Form submission
      form.addEventListener('submit', function (e) {
        e.preventDefault();

        var email = emailInput.value.trim();
        var valid = true;

        if (!email) {
          emailError.textContent = 'Email is required.';
          emailError.classList.add('show');
          emailInput.classList.add('error');
          valid = false;
        } else if (!auth.isValidEmail(email)) {
          emailError.textContent = 'Please enter a valid email address.';
          emailError.classList.add('show');
          emailInput.classList.add('error');
          valid = false;
        }

        if (!valid) return;

        // Show loading
        resetBtn.disabled = true;
        resetBtnText.textContent = 'Sending...';
        resetSpinner.style.display = 'inline-block';

        // Simulate network delay
        setTimeout(function () {
          var result = auth.isValidEmail(email) ?
            LearnSphereAPI.requestPasswordReset(email) :
            { success: false, message: 'Invalid email.' };

          resetBtn.disabled = false;
          resetBtnText.textContent = 'Send Reset Link';
          resetSpinner.style.display = 'none';

          if (result.success) {
            // Show success state
            form.style.display = 'none';
            successAlert.innerHTML = '<div style="text-align:center;padding:var(--space-lg) 0;">' +
              '<div style="width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,0.1);color:var(--success);display:flex;align-items:center;justify-content:center;font-size:1.75rem;margin:0 auto var(--space-lg);">&#10003;</div>' +
              '<h2 style="font-size:1.25rem;font-weight:600;margin-bottom:var(--space-md);">Check Your Email</h2>' +
              '<p style="color:var(--text-secondary);font-size:0.9rem;line-height:1.6;">If an account exists with <strong>' + email + '</strong>, password reset instructions will be sent shortly.</p>' +
              '</div>';
            successAlert.classList.add('show');
          } else {
            errorAlert.textContent = result.message;
            errorAlert.classList.add('show');
          }
        }, 1000);
      });
    });
  </script>

</body>
</html>
